<!doctype html>
<html lang="ja" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pixel Art">
  <title>Pixel Art Editor</title>
  <link id="favicon" rel="icon" type="image/png" href="apple-touch-icon-v9.png">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="apple-touch-icon-v9.png">
  <link href="https://unpkg.com/font-misaki/misaki_gothic.css" rel="stylesheet">
  <link href="https://unpkg.com/font-misaki/misaki_mincho.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #6b7280;
      --panel: #ffffff;
      --line: #d9dee7;
      --soft: #f4f7fb;
      --canvas: #eef2f7;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b91c1c;
      --radius: 8px;
      --shadow: 0 18px 48px rgba(25, 35, 48, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(245, 158, 11, 0.10)),
        #f7f9fc;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    button:hover {
      border-color: #9aa7b8;
      transform: translateY(-1px);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.24);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px clamp(14px, 3vw, 28px);
      border-bottom: 1px solid rgba(23, 32, 38, 0.10);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      object-fit: cover;
      border: 1px solid #c8d1dd;
      border-radius: var(--radius);
      background: #10d5dc;
      box-shadow: 0 6px 18px rgba(23, 32, 38, 0.10);
      image-rendering: pixelated;
    }

    h1 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: 0;
      line-height: 1.1;
      white-space: nowrap;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) minmax(250px, 300px);
      gap: 16px;
      padding: clamp(14px, 3vw, 24px);
      min-height: 0;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 32, 38, 0.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #43505f;
    }

    .left,
    .right {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .canvas-shell {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 24px);
      background:
        linear-gradient(90deg, rgba(23, 32, 38, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 32, 38, 0.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 18px 18px;
      border: 1px solid rgba(23, 32, 38, 0.12);
      border-radius: var(--radius);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72), var(--shadow);
      overflow: auto;
    }

    #canvas {
      width: min(72vmin, 720px, 100%);
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 220px);
      aspect-ratio: 1;
      background: #fff;
      border: 1px solid #aab6c5;
      box-shadow: 0 18px 44px rgba(23, 32, 38, 0.16);
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tool-btn,
    .icon-btn {
      min-height: 42px;
      border-radius: var(--radius);
      display: inline-grid;
      place-items: center;
      font-weight: 700;
    }

    .tool-btn[aria-pressed="true"],
    .icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-dark);
    }

    .tool-btn svg,
    .selection-action-btn svg {
      width: 24px;
      height: 24px;
      pointer-events: none;
      stroke-width: 2.15;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: #415063;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .height-field::before {
      content: "\9AD8\3055";
    }

    select,
    input[type="number"],
    input[type="text"],
    textarea {
      min-width: 0;
      border: 1px solid #cfd7e3;
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }

    select,
    input[type="number"],
    input[type="text"] {
      height: 38px;
    }

    textarea {
      min-height: 58px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.35;
    }

    input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 2px;
      border: 1px solid #cfd7e3;
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    input[type="color"]::-moz-color-swatch {
      border: 0;
      border-radius: 6px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border: 1px solid #cfd7e3;
      border-radius: var(--radius);
      background: #eef2f7;
    }

    .segment-btn {
      min-height: 32px;
      border-radius: 6px;
      border-color: transparent;
      background: transparent;
      font-weight: 750;
    }

    .segment-btn[aria-pressed="true"] {
      background: #ffffff;
      border-color: #b8c3d2;
      color: var(--accent-dark);
      box-shadow: 0 1px 5px rgba(23, 32, 38, 0.10);
    }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 8px;
      align-items: end;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 7px;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      min-height: 26px;
      border-radius: var(--radius);
      border: 2px solid rgba(23, 32, 38, 0.16);
    }

    .swatch.active {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.22);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      min-height: 40px;
      border-radius: var(--radius);
      font-weight: 750;
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .selection-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .selection-action-btn {
      min-height: 48px;
      padding: 0;
    }

    .selection-note {
      margin: 0;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .layer-actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .layer-list {
      display: grid;
      gap: 8px;
    }

    .layer-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: center;
    }

    .layer-name-button,
    .layer-name-input {
      min-height: 40px;
      height: 40px;
      padding: 0 12px;
      overflow: hidden;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .layer-name-button {
      justify-content: start;
    }

    .layer-row.active .layer-name-button,
    .layer-row.active .layer-name-input {
      background: rgba(15, 118, 110, 0.12);
      border-color: var(--accent);
      color: #0b5f59;
    }

    .layer-icon-btn {
      min-height: 40px;
      padding: 0;
    }

    .layer-icon-btn svg {
      width: 22px;
      height: 22px;
      pointer-events: none;
      stroke-width: 2.1;
    }

    .layer-delete-btn {
      color: #1b1f24;
      border-color: #cfd7e3;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-dark);
    }

    .danger {
      color: var(--danger);
      border-color: rgba(185, 28, 28, 0.34);
    }

    .status {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #465568;
      font-size: 0.85rem;
    }

    .status strong {
      color: var(--ink);
      font-size: 0.92rem;
    }

    .preview-frame {
      display: grid;
      place-items: center;
      min-height: 196px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background-color: #e7edf5;
      background-image:
        linear-gradient(45deg, #cfd8e5 25%, transparent 25%),
        linear-gradient(-45deg, #cfd8e5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #cfd8e5 75%),
        linear-gradient(-45deg, transparent 75%, #cfd8e5 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      overflow: hidden;
    }

    #preview {
      width: 160px;
      height: 160px;
      border: 0;
      box-shadow: none;
      max-height: none;
      cursor: default;
      pointer-events: none;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .mini-note {
      margin: 0;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(23, 32, 38, 0.38);
    }

    .confirm-overlay[hidden] {
      display: none;
    }

    .confirm-dialog {
      width: min(420px, 100%);
      padding: 18px;
      border: 1px solid rgba(23, 32, 38, 0.16);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 22px 60px rgba(23, 32, 38, 0.24);
    }

    .confirm-dialog h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
    }

    .confirm-list {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
      color: #405064;
      font-size: 0.9rem;
    }

    .confirm-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #edf1f6;
    }

    .confirm-list strong {
      color: var(--ink);
      font-weight: 750;
      text-align: right;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 1040px) {
      .main {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .right {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(240px, 1fr);
      }
    }

    @media (max-width: 760px) {
      html {
        scroll-padding-top: 72px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        align-items: center;
        flex-direction: row;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: none;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
      }

      h1 {
        font-size: 1rem;
      }

      .file-actions {
        position: fixed;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        left: 12px;
        z-index: 15;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
        border: 1px solid rgba(23, 32, 38, 0.12);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 16px 46px rgba(23, 32, 38, 0.22);
        backdrop-filter: blur(14px);
      }

      .file-actions button {
        min-height: 48px;
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px 10px calc(96px + env(safe-area-inset-bottom));
      }

      .workspace {
        order: 1;
        gap: 8px;
      }

      .left {
        order: 2;
      }

      .right {
        order: 3;
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 12px;
        box-shadow: 0 8px 24px rgba(25, 35, 48, 0.10);
      }

      .left,
      .right {
        gap: 10px;
      }

      .toolbar {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(52px, 1fr);
        grid-template-columns: none;
        overflow-x: auto;
        padding-bottom: 2px;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
      }

      .tool-btn,
      .icon-btn,
      .action-btn,
      .layer-icon-btn,
      .segment-btn {
        min-height: 46px;
      }

      .tool-btn {
        scroll-snap-align: start;
      }

      .canvas-shell {
        min-height: min(58vh, 430px);
        padding: 10px;
      }

      #canvas {
        width: min(94vw, 640px, 100%);
        height: auto;
        max-height: 58vh;
      }

      .status {
        min-height: 36px;
        padding: 9px 10px;
        font-size: 0.78rem;
      }

      .control-grid,
      .color-row {
        grid-template-columns: 1fr;
      }

      select,
      input[type="number"],
      input[type="text"] {
        height: 44px;
      }

      input[type="color"] {
        height: 50px;
      }

      textarea {
        min-height: 70px;
      }

      .palette {
        grid-template-columns: repeat(8, minmax(34px, 1fr));
        gap: 8px;
      }

      .swatch {
        min-height: 36px;
      }

      .preview-frame {
        min-height: 148px;
      }

      #preview {
        width: 128px;
        height: 128px;
      }

      .confirm-overlay {
        align-items: end;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      }

      .confirm-dialog {
        width: 100%;
        border-radius: 14px;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        gap: 10px;
      }

      .brand {
        gap: 8px;
      }

      .main {
        padding-inline: 8px;
      }

      .canvas-shell {
        min-height: min(54vh, 390px);
      }

      #canvas {
        width: min(96vw, 100%);
        max-height: 54vh;
      }

      .toolbar {
        grid-auto-columns: 52px;
      }

      .layer-actions {
        gap: 6px;
      }

      .selection-actions {
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" id="appIcon" src="apple-touch-icon-v9.png" alt="" aria-hidden="true">
        <h1 id="appTitle" class="notranslate" translate="no">Pixel Art Editor</h1>
      </div>
      <div class="file-actions" aria-label="ファイル操作">
        <button class="action-btn" id="importImage" type="button">インポート</button>
        <button class="action-btn primary" id="exportPng" type="button">PNG保存</button>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
    </header>

    <main class="main">
      <aside class="left" aria-label="編集メニュー">
        <section class="panel stack">
          <h2>描画ツール</h2>
          <div class="toolbar" role="toolbar" aria-label="描画ツール">
            <button class="tool-btn" type="button" data-tool="draw" aria-label="ペン" title="ペン">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.7 4.4a2.5 2.5 0 0 1 3.5 3.5L9.4 18.7 4.5 20l1.3-4.9L16.7 4.4z"></path>
                <path d="M14.8 6.3l2.9 2.9"></path>
                <path d="M5.8 15.1l3.6 3.6"></path>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="erase" aria-label="消しゴム" title="消しゴム">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.2 14.3l7.7-7.7a3 3 0 0 1 4.2 0l1.7 1.7a3 3 0 0 1 0 4.2l-5.8 5.8H8.7l-3.5-3.5a.4.4 0 0 1 0-.5z"></path>
                <path d="M11.2 8.3l4.5 4.5"></path>
                <path d="M8.2 20h9.6"></path>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="fill" aria-label="塗りつぶし" title="塗りつぶし">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.2 12.1l6.2-6.2a2.3 2.3 0 0 1 3.2 0l4.2 4.2a2.3 2.3 0 0 1 0 3.2L13.1 19a2.3 2.3 0 0 1-3.2 0l-4.7-4.7a1.5 1.5 0 0 1 0-2.2z"></path>
                <path d="M8.6 8.7l6.7 6.7"></path>
                <path d="M19.2 16.7c1 1 1.6 1.8 1.6 2.5a1.8 1.8 0 0 1-3.6 0c0-.7.7-1.5 2-2.5z"></path>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="pick" aria-label="色を拾う" title="色を拾う">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.9 4.7a2.4 2.4 0 0 1 3.4 0l1 1a2.4 2.4 0 0 1 0 3.4l-8.4 8.4H7.4v-3.5l7.5-9.3z"></path>
                <path d="M13.2 7.2l3.6 3.6"></path>
                <path d="M7.4 17.5l-3 2"></path>
                <path d="M4.4 20.5h5.3"></path>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="lasso" aria-label="なげわ選択" title="なげわ選択">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.2 8.4c1.1-3.2 6.9-4.4 10.7-2.4 3.5 1.9 3.7 5.9.5 7.6-3.7 2-10.4.8-11.5-2.2-.3-.9-.2-2 .3-3z"></path>
                <path d="M5.4 11.1c-1.8 1.5-1.5 3.6.8 5 3.4 2.1 10.4 2 13.2-.1"></path>
                <path d="M10.8 17.1l-2.2 3.5"></path>
                <path d="M8.2 20.6h4.5"></path>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="circle" aria-label="丸" title="丸">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="7.2"></circle>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="rect" aria-label="四角" title="四角">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5.5" y="5.5" width="13" height="13" rx="1.2"></rect>
              </svg>
            </button>
            <button class="tool-btn" type="button" data-tool="text" aria-label="テキスト" title="テキスト">
